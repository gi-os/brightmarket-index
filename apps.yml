apps:
- pkg: com.gios.lighttip
  name: BrightTip
  repo: gi-os/BrightTip
  category: productivity
  summary: Tip calculator, and a receipt splitter that reads the line items off a
    photo.
- pkg: com.gios.lightnoise
  name: BrightNoise
  repo: gi-os/BrightNoise
  category: media
  summary: Twelve synthesised sounds, a two-layer mixer and a sleep timer.
- pkg: com.gios.lightauth
  name: BrightAuthenticator
  repo: gi-os/BrightAuthenticator
  category: utilities
  summary: IN DEVELOPMENT - TOTP codes on the Light Phone III, in a PIN-wrapped vault.
- pkg: com.gios.lightsports
  name: BrightSports
  repo: gi-os/BrightSports
  category: utilities
  summary: Live scores and standings across thirteen leagues.
- pkg: com.gios.brightmarket
  name: BrightMarket
  repo: gi-os/BrightMarket
  category: utilities
  summary: The marketplace itself. Browse, install and update Light Phone apps.
- pkg: com.lightfastread
  name: BrightLibrary
  repo: gi-os/BrightLibrary
  category: reading
  summary: EPUB, comics and Calibre, with a cover shelf and a page view.
- pkg: com.gios.lightremote
  name: BrightRemote
  repo: gi-os/BrightRemote
  category: utilities
  summary: Apple TV remote, speaking the Companion protocol natively.
- pkg: com.gios.lightchat
  name: BrightChat
  repo: gi-os/BrightChat
  category: utilities
  summary: iMessage over a self-hosted BlueBubbles server.
- pkg: com.gios.lightcontrol
  name: BrightControl
  repo: gi-os/BrightControl
  category: hardware
  summary: The wheel and camera button, working phone-wide.
- pkg: com.gios.lightnotebook
  name: BrightNotebook
  repo: gi-os/BrightNotebook
  category: productivity
  summary: Notes and a calendar, with your day gathered in one place.
- pkg: com.gios.lightnonogram
  name: BrightNonogram
  repo: gi-os/BrightNonogram
  category: games
  summary: Picross, plus a generator that only ships solvable puzzles.
- pkg: com.thelightphone.solitaire
  name: BrightSolitaire
  repo: gi-os/BrightSolitaire
  category: games
  summary: Klondike, draw one, unlimited redeals.
- pkg: com.thelightphone.lightnycsubway
  name: BrightTransit
  repo: gi-os/BrightTransit
  category: utilities
  summary: Live MTA subway arrivals.
- pkg: com.lightrss.reader
  name: BrightNews
  repo: gi-os/BrightNews
  category: reading
  summary: RSS, Atom and Gmail newsletters in one reader.
- pkg: com.gios.lightpass
  name: BrightPasses
  repo: gi-os/BrightPasses
  category: utilities
  summary: Photograph a ticket, keep the stub.
- pkg: app.lightphonekeyboard
  name: LightKeyboard
  repo: gi-os/LightKeyboard
  category: hardware
  summary: A fork of the Light Phone keyboard, adding swipe typing and autocorrect
    from a bundled dictionary. Works offline.
- pkg: com.gios.lightfog
  name: FogLight
  repo: gi-os/FogLight
  category: utilities
  summary: 'Fog of World companion: record where you go, watch the fog clear.'
- pkg: com.gios.lightcamera
  name: Roll
  repo: gi-os/Roll
  category: media
  summary: 'Camera and album: a film-roll viewfinder, real-time filters, face detection
    and a QR mode.'
- pkg: com.gios.lightqr
  name: LightQR
  repo: gi-os/LightQR
  category: utilities
  summary: QR scanner and generator. Folded into Roll, which now has a QR mode.
  deprecated: true
  supersededBy: Roll
- pkg: com.thelightphone.sdk
  name: Sanntid
  repo: barry7007/LightNorwayTransit
  category: utilities
  summary: Live departure times for public transport in Norway
