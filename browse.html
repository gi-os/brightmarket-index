<!DOCTYPE html>
<!--
  BrightMarket — the desktop catalogue.

  The other half of the phone's focus mode: browsing happens here, on a screen
  where browsing is fine, and only a decision travels to the phone as a QR.

  The QR belongs to the SELECTED app only — the tile grid deliberately has none.
  A wall of codes is unreadable and invites scanning the wrong one; you pick an
  app, read about it, and then there is exactly one code on screen to point a
  phone at.

  Reads the same index-v1.json the phone reads, so there is one source of truth.
  Everything else is inline: no build step, no framework, one file to deploy.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BrightMarket</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Varela+Round&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #000; --fg: #fff;
    --line: #1c1c21; --line-2: #26262b; --edge: #2e2e34;
    --dim: #7a7a80; --dimmer: #5a5a60; --dimmest: #3e3e44;
    --mono: 'IBM Plex Mono', monospace;
    --sans: 'IBM Plex Sans', sans-serif;
    --round: 'Varela Round', sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); }
  body { font-family: var(--sans); color: var(--fg); }
  a { color: var(--fg); text-decoration: none; }
  input { font: inherit; }
  input::placeholder { color: #6a6a6e; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--edge); border-radius: 999px; }

  @keyframes bob { 0%,100% { transform: translateY(0);} 50% { transform: translateY(-4px);} }
  @keyframes sheen { 0% { transform: translateX(-130%);} 100% { transform: translateX(330%);} }
  @keyframes blink { 0%,100% { opacity: 1;} 50% { opacity: .2;} }
  @keyframes marquee { 0% { transform: translateX(0);} 100% { transform: translateX(-50%);} }
  @keyframes scan { 0% { transform: translateY(-100%);} 100% { transform: translateY(900%);} }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

  .shell { min-height:100vh; }
  .col { width:100%; min-height:100vh; display:flex; flex-direction:column; }

  .bar { position:sticky; top:0; z-index:20; background:var(--bg); flex-shrink:0; height:60px; display:flex; align-items:center; justify-content:space-between;
         padding:0 34px; border-bottom:1px solid var(--line); }
  .logo { width:26px; height:26px; border-radius:8px; background:var(--fg); color:#000;
          display:flex; align-items:center; justify-content:center; font-family:var(--round); font-size:15px; }
  .wordmark { font-family:var(--mono); font-size:12px; letter-spacing:.34em; color:#8a8a8e; }
  .live { width:7px; height:7px; border-radius:50%; background:var(--fg); animation:blink 2.4s ease-in-out infinite; }
  .status { font-family:var(--mono); font-size:9px; letter-spacing:.22em; color:#4a4a50; }
  .pill-link { display:flex; align-items:center; gap:9px; height:36px; padding:0 17px; border-radius:999px;
               box-shadow:inset 0 0 0 1px #3a3a40; font-family:var(--mono); font-size:10px;
               letter-spacing:.18em; transition:.15s; }
  .pill-link:hover { background:var(--fg); color:#000; box-shadow:inset 0 0 0 1px var(--fg); }

  .hero-wrap { position:sticky; top:59px; z-index:10; background:var(--bg); flex-shrink:0;
    overflow:hidden; border-bottom:1px solid var(--line); }
  /* On a short window a sticky hero would leave no room for the grid, so below
     that height it scrolls away normally. */
  /* On a short window all this stacked chrome would leave no room for the
     grid it exists to help you browse, so below that height it scrolls. */
  @media (max-height: 820px) {
    .hero-wrap, .wire { position:relative; top:auto; }
  }
  .hero-scan { position:absolute; left:0; right:0; top:0; height:80px; pointer-events:none;
    background:linear-gradient(180deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.04) 60%,rgba(255,255,255,0) 100%);
    animation:scan 8s linear infinite; }
  .hero { display:flex; gap:30px; padding:26px 34px; }
  .hero-icon { position:relative; width:172px; height:172px; border-radius:16px; overflow:hidden;
    border:2px solid var(--fg); animation:bob 5s ease-in-out infinite; display:flex;
    align-items:center; justify-content:center; background:#000; font-family:var(--round); font-size:72px; }
  .hero-icon .sh { position:absolute; inset:0; animation:sheen 5s ease-in-out infinite;
    background:linear-gradient(115deg,rgba(255,255,255,0) 42%,rgba(255,255,255,.22) 50%,rgba(255,255,255,0) 58%); }
  .cat-pill { padding:3px 10px; border-radius:999px; background:var(--fg); color:#000;
    font-family:var(--mono); font-size:10px; font-weight:600; letter-spacing:.12em; }
  .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--line-2);
    border:1px solid var(--line-2); border-radius:8px; overflow:hidden; max-width:520px; }
  .stat { background:#000; padding:9px 12px; }
  .stat b { display:block; font-family:var(--mono); font-size:9px; letter-spacing:.14em; color:#6a6a70; font-weight:400; }
  .stat i { display:block; font-family:var(--mono); font-size:13px; font-style:normal; margin-top:3px; }
  .shots { display:flex; gap:10px; flex-wrap:wrap; }
  .shots img { height:158px; border-radius:6px; border:1px solid var(--line-2); background:#000;
    cursor:zoom-in; transition:.15s; }
  .shots img:hover { border-color:var(--fg); }
  .lightbox-img { max-width:100%; max-height:calc(100vh - 160px); border-radius:8px;
    border:1px solid var(--line-2); }
  .noshots { display:flex; align-items:center; padding:0 16px; height:52px; max-width:340px;
    border:1px dashed var(--edge); border-radius:8px; font-family:var(--mono); font-size:11px;
    letter-spacing:.1em; color:#6a6a70; }
  .qr-card { border-radius:12px; padding:12px; display:flex; flex-direction:column; align-items:center;
    gap:8px; background:var(--fg); }
  .qr-cap { font-family:var(--mono); font-size:9px; letter-spacing:.1em; color:#000; text-align:center; line-height:1.5; }
  .btn { display:flex; align-items:center; justify-content:center; height:44px; border-radius:999px;
    background:var(--fg); color:#000; font-family:var(--mono); font-size:11px; letter-spacing:.16em; transition:.15s; }
  .btn:hover { background:#000; color:var(--fg); box-shadow:inset 0 0 0 2px var(--fg); }
  .btn-ghost { height:38px; background:transparent; color:var(--fg); box-shadow:inset 0 0 0 1px #3a3a40; font-size:10px; letter-spacing:.12em; }
  .btn-ghost:hover { background:transparent; color:var(--fg); box-shadow:inset 0 0 0 1px var(--fg); }

  .wire { position:sticky; top:calc(60px + var(--hero-h, 232px)); z-index:9; background:var(--bg);
    flex-shrink:0; height:34px; display:flex; align-items:center; gap:14px; padding:0 34px;
    border-bottom:1px solid var(--line); }
  .wire-tag { flex-shrink:0; font-family:var(--mono); font-size:9px; letter-spacing:.26em;
    padding:3px 8px; border-radius:4px; background:#1a1a1e; }
  .wire-track { flex:1; overflow:hidden; position:relative; height:14px; }
  .wire-run { position:absolute; display:flex; gap:34px; white-space:nowrap; animation:marquee 150s linear infinite;
    font-family:var(--mono); font-size:9.5px; letter-spacing:.2em; color:var(--dimmer); }
  .nav { cursor:pointer; width:32px; height:24px; border-radius:6px; box-shadow:inset 0 0 0 1px var(--edge);
    color:#8a8a90; display:flex; align-items:center; justify-content:center; font-size:11px; transition:.15s; }
  .nav:hover { box-shadow:inset 0 0 0 1px var(--fg); color:var(--fg); }

  .filters { flex-shrink:0; padding:14px 34px 12px; display:flex; flex-direction:column; gap:11px;
    border-bottom:1px solid var(--line); }
  .filters input { flex:1; max-width:420px; border:none; outline:none; background:transparent;
    font-size:14px; color:var(--fg); padding:2px 0; border-bottom:2px solid var(--edge); }
  .filters input:focus { border-bottom-color: var(--fg); }
  .chip { cursor:pointer; padding:4px 11px; border-radius:999px; font-family:var(--mono); font-size:10px;
    letter-spacing:.12em; color:var(--dim); box-shadow:inset 0 0 0 1px var(--line-2); transition:.15s; }
  .chip:hover { color:var(--fg); box-shadow:inset 0 0 0 1px var(--edge); }
  .chip[aria-selected="true"] { background:var(--fg); color:#000; box-shadow:none; }

  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(272px, 1fr)); gap:12px;
    padding:16px 34px 0; }
  .tile { cursor:pointer; padding:12px; border-radius:12px; border:1px solid var(--line-2);
    display:flex; flex-direction:column; min-height:124px; transition:.15s; background:#000; }
  .tile:hover { border-color:var(--fg); transform:translateY(-3px); }
  .tile[aria-selected="true"] { border-color:var(--fg); }
  .tile-icon { width:38px; height:38px; border-radius:10px; flex-shrink:0; display:flex; align-items:center;
    justify-content:center; font-family:var(--round); font-size:18px; background:var(--fg); color:#000; }
  .tile-name { font-family:var(--round); font-size:15px; }
  .tile-meta { font-family:var(--mono); font-size:9px; letter-spacing:.1em; color:#7a7a80; margin-top:3px; }
  .tile-sum { font-size:11.5px; line-height:1.45; color:var(--dim); margin-top:9px; flex:1; }
  .tile-pill { font-family:var(--mono); font-size:9px; letter-spacing:.1em; padding:2px 8px;
    border-radius:999px; box-shadow:inset 0 0 0 1px var(--line-2); color:var(--dim); }
  .add-tile { display:flex; flex-direction:column; justify-content:center; gap:6px; padding:12px;
    border-radius:12px; border:2px dashed #34343a; min-height:124px; transition:.15s; }
  .add-tile:hover { border-color:var(--fg); transform:translateY(-3px); }

  .foot { padding:26px 34px; }
  .empty { padding:40px 0; text-align:center; font-family:var(--mono); font-size:12px;
    letter-spacing:.14em; color:#6a6a70; }
  .note { margin-top:26px; font-family:var(--mono); font-size:10px; letter-spacing:.16em; color:var(--dimmest); }
  @media (max-width: 900px) { .hero { flex-wrap: wrap; } }

  /* README overlay. Fixed rather than inline: the hero is sticky, so an inline
     panel would either be trapped under it or push the whole grid around. */
  .veil { position:fixed; inset:0; background:rgba(0,0,0,.82); z-index:60;
    display:flex; align-items:flex-start; justify-content:center; padding:40px 20px; }
  .sheet { width:100%; max-width:860px; max-height:calc(100vh - 80px); overflow:auto;
    background:#000; border:1px solid var(--line-2); border-radius:14px; }
  .sheet-bar { position:sticky; top:0; background:#000; border-bottom:1px solid var(--line);
    padding:14px 22px; display:flex; align-items:center; justify-content:space-between; }
  .sheet-body { padding:22px 26px 34px; font-size:14px; line-height:1.65; color:#d8d8dc; }
  .sheet-body h1 { font-family:var(--round); font-size:24px; margin:22px 0 10px; color:var(--fg); }
  .sheet-body h2 { font-family:var(--round); font-size:18px; margin:22px 0 8px; color:var(--fg); }
  .sheet-body h3 { font-family:var(--round); font-size:15px; margin:18px 0 6px; color:var(--fg); }
  .sheet-body a { border-bottom:1px solid var(--edge); }
  .sheet-body code { font-family:var(--mono); font-size:12.5px; background:#141418;
    padding:1px 5px; border-radius:4px; }
  .sheet-body pre { background:#0d0d10; border:1px solid var(--line-2); border-radius:8px;
    padding:12px 14px; overflow:auto; }
  .sheet-body pre code { background:none; padding:0; }
  .sheet-body img { max-width:100%; border-radius:6px; }
  .sheet-body table { border-collapse:collapse; width:100%; font-size:13px; display:block; overflow:auto; }
  .sheet-body th, .sheet-body td { border:1px solid var(--line-2); padding:6px 9px; text-align:left; }
  .sheet-body blockquote { margin:14px 0; padding:2px 0 2px 14px; border-left:2px solid var(--edge); color:var(--dim); }
  .sheet-body hr { border:none; border-top:1px solid var(--line); margin:22px 0; }
</style>
</head>
<body>
<div class="shell"><div class="col">

  <div class="bar">
    <div style="display:flex; align-items:center; gap:13px;">
      <div class="logo">B</div>
      <div class="wordmark">BRIGHTMARKET</div>
    </div>
    <div style="display:flex; align-items:center; gap:12px;">
      <a class="pill-link" href="./submit.html"><span style="font-size:14px; line-height:1;">＋</span>ADD YOUR APP</a>
    </div>
  </div>

  <div class="hero-wrap">
    <div class="hero-scan"></div>
    <div class="hero" id="hero"></div>
  </div>

  <div class="wire">
    <div class="wire-tag">WIRE</div>
    <div class="wire-track"><div class="wire-run" id="wire"></div></div>
  </div>

  <div class="filters">
    <div style="display:flex; align-items:center; gap:10px;">
      <div style="font-family:var(--mono); font-size:12px; color:#6a6a70;">⌕</div>
      <input id="q" type="text" placeholder="Filter apps" autocomplete="off" />
      <div style="flex:1"></div>
      <div class="status" id="count"></div>
    </div>
    <div style="display:flex; gap:6px; flex-wrap:wrap; align-items:center;">
      <div style="display:flex; gap:6px; flex-wrap:wrap;" id="cats"></div>
      <div style="flex:1"></div>
      <div style="display:flex; gap:6px;" id="sorts"></div>
    </div>
  </div>

  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none;">NOTHING MATCHES — TRY ANOTHER WORD</div>

  <div class="foot">
    <div style="padding-top:18px; border-top:1px solid var(--line); display:flex; gap:26px;
                align-items:flex-start; flex-wrap:wrap;">
      <div style="flex:1; min-width:300px;">
        <div style="font-family:var(--round); font-size:15px;">Focus mode</div>
        <div style="font-size:12px; line-height:1.55; color:var(--dim); margin-top:6px; max-width:52ch;">
          Turn it on in the app's own Settings. Once it's on, this code is the
          only way back — which is the point: the thing you'd have to go and
          find is a different screen in a different room.
        </div>
      </div>
      <div style="display:flex; flex-direction:column; align-items:center; gap:8px;">
        <div id="qr-off" style="width:180px; height:180px; background:#fff; border-radius:10px;
             display:flex; align-items:center; justify-content:center;"></div>
        <div class="status">SCAN TO TURN FOCUS MODE OFF</div>
      </div>
    </div>
  </div>

</div></div>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<!-- A README is arbitrary markdown from an arbitrary repo, and markdown may
     contain raw HTML. Rendering it unsanitised into the page would be a
     scripting hole the moment anyone submits a repo. -->
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script>
  const INDEX = "./index-v1.json";
  const $ = (id) => document.getElementById(id);

  let apps = [], sel = 0, query = "", cat = "All", sortBy = "Popular";
  const SORTS = ["Popular", "Updated", "Name"];

  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const mb = (n) => (n / 1e6).toFixed(1) + " MB";
  // Who published it. Taken from the repo's owner rather than a hand-written
  // field, so it can't drift and is right for submissions from anyone.
  const dev = (a) => String(a.repo || "").split("/")[0] || "unknown";
  // Not every repo tags vX.Y.Z -- BrightLibrary ships "build-50" -- so only
  // prefix a "v" when the string actually starts with a number.
  const ver = (v) => (/^\d/.test(String(v)) ? "v" + v : String(v));
  const day = (iso) => {
    const d = new Date(iso);
    return isNaN(d) ? "—" : d.toLocaleDateString("en-GB", { day: "2-digit", month: "short" }).toUpperCase();
  };

  function qrInto(node, text, cell) {
    if (!node || typeof qrcode !== "function") return;
    const key = text + "|" + cell;
    if (node.dataset.qr === key) return;   // repainting on every keystroke is visible
    const q = qrcode(0, "L");              // lowest EC keeps the code sparse and easy to read off a monitor
    q.addData(text); q.make();
    node.innerHTML = q.createSvgTag({ cellSize: cell, margin: 1, scalable: false });
    node.dataset.qr = key;
  }

  function visible() {
    const t = query.trim().toLowerCase();
    const list = apps.filter((a) => {
      const catOk = cat === "All" || (a.category || "").toLowerCase() === cat.toLowerCase();
      const qOk = !t ||
        a.name.toLowerCase().includes(t) ||
        (a.summary || "").toLowerCase().includes(t) ||
        (a.category || "").toLowerCase().includes(t) ||
        // applicationIds still read com.gios.light* after the rename, so
        // someone searching "light" has to keep finding them.
        a.pkg.toLowerCase().includes(t);
      return catOk && qOk;
    });
    return list.slice().sort((a, b) => {
      if (sortBy === "Popular") return (b.downloads || 0) - (a.downloads || 0);
      if (sortBy === "Updated") return new Date(b.latest.published) - new Date(a.latest.published);
      return a.name.localeCompare(b.name);
    });
  }

  function renderHero(app) {
    if (!app) { $("hero").innerHTML = ""; return; }
    const shots = (app.screenshots || []).slice(0, 3);
    $("hero").innerHTML = `
      <div style="flex-shrink:0; display:flex; flex-direction:column; gap:12px; align-items:center; width:172px;">
        <div class="hero-icon">${esc(app.name[0])}<div class="sh"></div></div>
        <div style="font-family:var(--mono); font-size:9px; letter-spacing:.14em; color:#6a6a70;
             text-align:center; line-height:1.7;">OPEN SOURCE<br />NO ACCOUNT</div>
      </div>

      <div style="flex:1; min-width:0; display:flex; flex-direction:column; gap:15px;">
        <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
          <div style="font-family:var(--round); font-size:30px; line-height:1;">${esc(app.name)}</div>
          <div class="cat-pill">${esc((app.category || "").toUpperCase())}</div>
          ${app.deprecated ? `<div class="cat-pill" style="background:#000; color:var(--fg); box-shadow:inset 0 0 0 1px var(--fg);">DEPRECATED${app.supersededBy ? " · USE " + esc(app.supersededBy.toUpperCase()) : ""}</div>` : ""}
          <div style="font-family:var(--mono); font-size:10px; letter-spacing:.14em; color:var(--dimmer);">${esc(app.pkg)}</div>
        </div>
        <div style="display:flex; align-items:center; gap:8px; margin-top:-8px;">
          <div style="font-family:var(--mono); font-size:10px; letter-spacing:.14em; color:#6a6a70;">BY</div>
          <a href="https://github.com/${esc(dev(app))}" target="_blank" rel="noopener"
             style="font-family:var(--mono); font-size:11px; letter-spacing:.08em; border-bottom:1px solid var(--edge);">${esc(dev(app))}</a>
        </div>
        <div style="font-size:15px; line-height:1.55; color:#d8d8dc; max-width:52ch;">${esc(app.summary)}</div>
        <div class="stats">
          <div class="stat"><b>VERSION</b><i>${esc(ver(app.latest.version))}</i></div>
          <div class="stat"><b>SIZE</b><i>${mb(app.latest.size)}</i></div>
          <div class="stat"><b>GETS</b><i>${app.downloads || 0}</i></div>
          <div class="stat"><b>UPDATED</b><i>${day(app.latest.published)}</i></div>
        </div>
        ${shots.length
          ? `<div class="shots">${shots.map((s) => `<img src="${esc(s.url)}" alt="" loading="lazy" />`).join("")}</div>`
          : `<div class="noshots">NO SCREENSHOTS SUBMITTED</div>`}
      </div>

      <div style="flex-shrink:0; width:176px; display:flex; flex-direction:column; gap:10px;">
        <div class="qr-card">
          <div id="hero-qr" style="width:136px; height:136px; display:flex; align-items:center; justify-content:center;"></div>
          <div class="qr-cap">SCAN WITH YOUR PHONE<br />TO OPEN IT THERE</div>
        </div>
        <a class="btn" href="${esc(app.latest.apk)}" target="_blank" rel="noopener">GET APK ↓</a>
        <div class="btn btn-ghost" id="readme-btn" style="cursor:pointer;">README</div>
        <a class="btn btn-ghost" href="https://github.com/${esc(app.repo)}" target="_blank" rel="noopener">SOURCE</a>
      </div>`;
    qrInto($("hero-qr"), "brightmarket://app/" + app.pkg, 4);
    $("readme-btn").addEventListener("click", () => openReadme(app));
    $("hero").querySelectorAll(".shots img").forEach((n, i) => {
      n.addEventListener("click", () => openShot(app, i));
      // Images arrive after layout and change the hero's height; without this
      // the seam reopens on exactly the apps that have screenshots.
      n.addEventListener("load", syncStickyOffsets);
    });
  }

  /**
   * Full-size screenshot over the page.
   *
   * Same overlay as the README for the same reason -- the hero is sticky, so
   * growing an image in place would push everything around it. Arrow keys step
   * through the app's other shots, because looking at one screenshot almost
   * always means wanting to see the next.
   */
  function openShot(app, startIndex) {
    const shots = (app.screenshots || []).map((s) => s.url);
    if (!shots.length) return;
    let i = startIndex;

    const veil = document.createElement("div");
    veil.className = "veil";
    veil.style.alignItems = "center";
    veil.innerHTML = `
      <div style="display:flex; flex-direction:column; align-items:center; gap:14px; max-width:100%;">
        <img class="lightbox-img" id="lb-img" alt="" />
        <div style="display:flex; align-items:center; gap:14px;">
          <div class="chip" data-step="-1" style="cursor:pointer;">◀</div>
          <div class="status" id="lb-pos"></div>
          <div class="chip" data-step="1" style="cursor:pointer;">▶</div>
          <div class="chip" data-close="1" style="cursor:pointer;">CLOSE</div>
        </div>
      </div>`;
    document.body.appendChild(veil);

    const paint = () => {
      veil.querySelector("#lb-img").src = shots[i];
      veil.querySelector("#lb-pos").textContent = `${i + 1}/${shots.length}`;
    };
    const step = (d) => { i = (i + d + shots.length) % shots.length; paint(); };
    const close = () => { veil.remove(); window.removeEventListener("keydown", onKey); };
    const onKey = (e) => {
      if (e.key === "Escape") close();
      if (e.key === "ArrowRight") step(1);
      if (e.key === "ArrowLeft") step(-1);
    };

    veil.addEventListener("click", (e) => {
      const d = e.target.dataset || {};
      if (d.step) return step(+d.step);
      if (d.close || e.target === veil) close();
    });
    window.addEventListener("keydown", onKey);
    paint();
  }

  // Cached per repo: reopening shouldn't refetch, and READMEs here run to 45KB.
  const readmeCache = new Map();

  async function openReadme(app) {
    const veil = document.createElement("div");
    veil.className = "veil";
    veil.innerHTML = `
      <div class="sheet">
        <div class="sheet-bar">
          <div style="font-family:var(--round); font-size:16px;">${esc(app.name)} · README</div>
          <div class="chip" data-close="1" style="cursor:pointer;">CLOSE</div>
        </div>
        <div class="sheet-body" id="sheet-body">Loading…</div>
      </div>`;
    document.body.appendChild(veil);

    const close = () => veil.remove();
    veil.addEventListener("click", (e) => {
      // Click the backdrop or CLOSE, but not the sheet itself.
      if (e.target === veil || e.target.dataset.close) close();
    });
    const onKey = (e) => { if (e.key === "Escape") { close(); window.removeEventListener("keydown", onKey); } };
    window.addEventListener("keydown", onKey);

    const body = veil.querySelector("#sheet-body");
    try {
      let md = readmeCache.get(app.repo);
      if (md == null) {
        // HEAD as the ref, so this works whatever the default branch is called
        // and costs no API rate limit -- raw.githubusercontent is unmetered,
        // the API is 60/hour unauthenticated.
        const res = await fetch(`https://raw.githubusercontent.com/${app.repo}/HEAD/README.md`);
        if (!res.ok) throw new Error(String(res.status));
        md = await res.text();
        readmeCache.set(app.repo, md);
      }
      const html = marked.parse(md, { mangle: false, headerIds: false });
      body.innerHTML = DOMPurify.sanitize(html, { ADD_ATTR: ["target"] });
      // Relative links and images in a README resolve against the repo, not
      // against this page, so rewrite them or they all 404.
      body.querySelectorAll("img[src]").forEach((n) => {
        const src = n.getAttribute("src");
        if (!/^https?:/i.test(src)) {
          n.src = `https://raw.githubusercontent.com/${app.repo}/HEAD/${src.replace(/^\.?\//, "")}`;
        }
      });
      body.querySelectorAll("a[href]").forEach((n) => {
        const href = n.getAttribute("href");
        if (!/^https?:|^#/i.test(href)) {
          n.href = `https://github.com/${app.repo}/blob/HEAD/${href.replace(/^\.?\//, "")}`;
        }
        n.target = "_blank";
        n.rel = "noopener";
      });
    } catch (err) {
      body.textContent = "Couldn't load the README for this app.";
    }
  }

  function syncStickyOffsets() {
    // Measured, not hardcoded: the hero grows and shrinks depending on whether
    // the selected app has screenshots, and a fixed offset would leave a gap or
    // overlap on half the catalogue.
    const h = document.querySelector(".hero-wrap");
    if (!h) return;
    // getBoundingClientRect, not offsetHeight: offsetHeight is rounded to whole
    // pixels, so on a fractional layout the ticker landed a sliver BELOW the
    // hero's real bottom edge and the grid scrolled through the seam.
    // Floor-then-1px-overlap guarantees they meet with no gap, at the cost of
    // one invisible pixel of the hero's border.
    const px = Math.max(0, Math.floor(h.getBoundingClientRect().height) - 1);
    document.documentElement.style.setProperty("--hero-h", px + "px");
  }

  function render() {
    const list = visible();
    if (sel > list.length - 1) sel = Math.max(0, list.length - 1);
    renderHero(list[sel]);

    requestAnimationFrame(syncStickyOffsets);

    $("count").textContent = list.length === apps.length
      ? `${apps.length} APPS` : `${list.length} OF ${apps.length}`;
    $("empty").style.display = list.length ? "none" : "block";

    $("grid").innerHTML = list.map((a, i) => `
      <div class="tile" data-i="${i}" aria-selected="${i === sel}">
        <div style="display:flex; gap:11px; align-items:flex-start;">
          <div class="tile-icon">${esc(a.name[0])}</div>
          <div style="min-width:0; flex:1;">
            <div class="tile-name">${esc(a.name)}</div>
            <div class="tile-meta">${esc(ver(a.latest.version))} · ${mb(a.latest.size)}</div>
            <div class="tile-meta">BY ${esc(dev(a).toUpperCase())}</div>
          </div>
        </div>
        <div class="tile-sum">${esc(a.summary)}</div>
        <div style="margin-top:9px; display:flex; align-items:center; justify-content:space-between;">
          <div class="tile-meta">${esc((a.category || "").toUpperCase())}</div>
          <div class="tile-pill">${a.downloads || 0} GETS</div>
        </div>
      </div>`).join("") + `
      <a class="add-tile" href="./submit.html">
        <div style="font-family:var(--round); font-size:26px; line-height:1;">＋</div>
        <div style="font-family:var(--round); font-size:14px;">Add your app</div>
        <div style="font-size:11.5px; line-height:1.45; color:var(--dim);">
          Sign in with GitHub, pick a repo with a release. CI does the rest.</div>
      </a>`;

    $("grid").querySelectorAll(".tile").forEach((n) =>
      n.addEventListener("click", () => {
        sel = +n.dataset.i;
        render();
        // No scrollIntoView here. It existed when the hero scrolled away with
        // the page; now that the hero is anchored the panel is always visible,
        // and scrolling to it just shunts the grid down under your cursor on
        // every single click.
      }));
  }

  function renderChips() {
    const cats = ["All", ...[...new Set(apps.map((a) => a.category).filter(Boolean))].sort()];
    $("cats").innerHTML = cats.map((c) =>
      `<div class="chip" data-cat="${esc(c)}" aria-selected="${c === cat}">${esc(c.toUpperCase())}</div>`).join("");
    $("cats").querySelectorAll(".chip").forEach((n) =>
      n.addEventListener("click", () => { cat = n.dataset.cat; sel = 0; renderChips(); render(); }));

    $("sorts").innerHTML = SORTS.map((s) =>
      `<div class="chip" data-sort="${s}" aria-selected="${s === sortBy}">${s.toUpperCase()}</div>`).join("");
    $("sorts").querySelectorAll(".chip").forEach((n) =>
      n.addEventListener("click", () => { sortBy = n.dataset.sort; sel = 0; renderChips(); render(); }));
  }

  function move(d) {
    const n = visible().length;
    if (!n) return;
    sel = (sel + d + n) % n;
    render();
  }

  $("q").addEventListener("input", (e) => { query = e.target.value; sel = 0; render(); });
  window.addEventListener("resize", syncStickyOffsets);
  window.addEventListener("keydown", (e) => {
    if (e.target && /input|textarea/i.test(e.target.tagName)) return;
    if (e.key === "ArrowRight") { move(1); e.preventDefault(); }
    if (e.key === "ArrowLeft") { move(-1); e.preventDefault(); }
  });

  (async function init() {
    qrInto($("qr-off"), "brightmarket://focus/off", 5);
    try {
      const res = await fetch(INDEX, { cache: "no-store" });
      const data = await res.json();
      apps = data.apps || [];
      $("wire").innerHTML = [0, 1].map(() =>
        `<span>${apps.map((a) => `${esc(a.name.toUpperCase())} ${esc(ver(a.latest.version))}`).join("</span><span>")}</span>`
      ).join("");
      renderChips();
      render();
    } catch (err) {
      $("empty").style.display = "block";
      $("empty").textContent = "COULDN'T LOAD THE INDEX";
    }
  })();
</script>
</body>
</html>
