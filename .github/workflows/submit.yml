name: Validate submission

on:
  issues:
    types: [opened, reopened, labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  validate:
    if: contains(github.event.issue.labels.*.name, 'submission')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml

      - name: Validate
        id: validate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python3 scripts/validate_submission.py

      # Passing opens a PR rather than committing straight to main: a submission
      # is a stranger's repo entering the index, so it gets one human look.
      - name: Open PR
        if: steps.validate.outputs.status == 'pass'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: submit/${{ steps.validate.outputs.pkg }}
          title: "Add ${{ steps.validate.outputs.name }} to the index"
          body: |
            Closes #${{ github.event.issue.number }}

            Automated checks passed: public repo, published release, exactly one
            `.apk` asset, parseable tag, applicationId read from the APK itself
            and not already indexed.
          commit-message: "index: add ${{ steps.validate.outputs.name }}"

      - name: Comment the result
        uses: actions/github-script@v7
        env:
          STATUS: ${{ steps.validate.outputs.status }}
          REASON: ${{ steps.validate.outputs.reason }}
        with:
          script: |
            const ok = process.env.STATUS === 'pass';
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: ok
                ? "Checks passed — a PR is open to add this to the index. Nothing more needed from you."
                : `Can't add this yet:\n\n> ${process.env.REASON}\n\nFix that and reopen this issue to re-run the checks.`
            });
            if (!ok) {
              await github.rest.issues.update({
                issue_number: context.issue.number,
                owner: context.repo.owner, repo: context.repo.repo, state: 'closed'
              });
            }
