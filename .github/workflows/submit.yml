name: Validate submission

on:
  issues:
    types: [opened, reopened, labeled]

# An issue filed with two labels fires opened + labeled + labeled, and the test
# submission got three identical "checks passed" comments and opened the same PR
# three times over. One run per issue, latest wins.
concurrency:
  group: submission-${{ github.event.issue.number }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  validate:
    # Three conjuncts, and the first one is the load-bearing one:
    #
    # 1. The issue's author. The `submission` label is applied automatically by
    #    .github/ISSUE_TEMPLATE/submit-app.yml to anything filed from the public
    #    template, so the label proves nothing about who filed it -- and this job
    #    holds contents:write and runs a `remove` action that deletes an indexed
    #    app's file and pushes that to main. Anyone with a GitHub account could
    #    have deleted any listing in the catalogue.
    #
    #    The submission portal does not file as the submitter: worker/worker.js
    #    creates the issue with SUBMIT_PAT, a fine-grained PAT belonging to
    #    `gi-os`, so every legitimate submission arrives authored by `gi-os`
    #    (verified against every existing `submission`-labelled issue on this
    #    repo). github.repository_owner is that same login, and writing it that
    #    way means a rename of the org can't silently reopen the hole.
    #
    #    A hand-filed issue from anyone else now runs nothing. That is intended:
    #    the portal is the supported route, and it proves repo ownership over
    #    OAuth before it ever files.
    #
    # 2/3. Unchanged -- ignores label events for anything other than
    #    'submission', so adding 'edit' or 'remove' alongside it isn't a second
    #    trigger.
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      contains(github.event.issue.labels.*.name, 'submission') &&
      (github.event.action != 'labeled' || github.event.label.name == 'submission')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      # pyaxmlparser reads the applicationId out of the binary manifest; the
      # string-pool guess it replaced picked an app's ancestor package.
      - run: pip install pyyaml pyaxmlparser

      - name: Validate
        id: validate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python3 scripts/validate_submission.py

      # An edit or a removal is the verified owner changing the text of a listing
      # that is already here -- ownership was proved by OAuth before the issue
      # was filed, and no new repo enters the catalogue. Holding those behind a
      # manual merge is friction with nothing on the other side of it: the first
      # thing that happened when this went live was someone editing their own
      # app and watching nothing change.
      #
      # A new listing still gets the human look, because that is a repo nobody
      # has looked at entering a list people install software from.
      - name: Apply an edit or removal directly
        if: steps.validate.outputs.status == 'pass' && steps.validate.outputs.action != 'submit'
        # NAME is free text out of the issue body. ${{ }} is substituted into the
        # script text before bash ever sees it, so interpolating it directly into
        # this `git commit -m "..."` handed anyone who could file a submission a
        # $(...) that ran with contents:write, issues:write and pull-requests:write.
        # Through env it arrives as data in a variable and bash never parses it.
        env:
          ACTION: ${{ steps.validate.outputs.action }}
          NAME: ${{ steps.validate.outputs.name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name  "brightmarket-bot"
          git config user.email "bot@users.noreply.github.com"
          git add apps/
          if git diff --staged --quiet; then
            echo "nothing changed"
          else
            git commit -m "index: $ACTION $NAME (closes #$ISSUE_NUMBER)"
            git push
          fi

      - name: Close the request
        if: steps.validate.outputs.status == 'pass' && steps.validate.outputs.action != 'submit'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            await github.rest.issues.update({
              issue_number: context.issue.number,
              owner: context.repo.owner, repo: context.repo.repo, state: 'closed'
            });

      - name: Open PR
        if: steps.validate.outputs.status == 'pass' && steps.validate.outputs.action == 'submit'
        # These are `with:` inputs, not a shell script: the action receives them
        # as INPUT_* and never passes them through a shell, so there is no
        # command substitution to reach here. `name` is additionally bounded to
        # ^[\w .\-]{1,60}$ by scripts/validate_submission.py, and `pkg` (which
        # becomes a branch name) is read out of the APK rather than typed.
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6.1.0
        with:
          # One branch per app per action, so an edit and a removal for the same
          # app don't overwrite each other's branch.
          branch: ${{ steps.validate.outputs.action }}/${{ steps.validate.outputs.pkg }}
          title: "${{ steps.validate.outputs.action }}: ${{ steps.validate.outputs.name }}"
          body: |
            Closes #${{ github.event.issue.number }}

            Requested by the repo's owner, verified through GitHub OAuth before
            the issue was filed. For a new listing the automated checks also
            passed: public repo, published release, exactly one `.apk` asset,
            parseable tag, and an applicationId read out of the APK itself that
            isn't already indexed.
          commit-message: "index: ${{ steps.validate.outputs.action }} ${{ steps.validate.outputs.name }}"

      # Runs on success and on failure, but NOT on cancellation.
      #
      # It had no condition at all once, and the first real submission passed its
      # checks, died on the PR step, and told the submitter nothing -- silence is
      # the one outcome a submission queue must never produce. The fix was
      # always(), which then ran on the run that the concurrency guard cancels
      # when an issue arrives with two labels: that run has no status to report,
      # so it posted "something went wrong on our side" a second before the real
      # run posted the actual reason. Two comments, the first of them wrong.
      - name: Comment the result
        if: ${{ !cancelled() }}
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          STATUS: ${{ steps.validate.outputs.status }}
          REASON: ${{ steps.validate.outputs.reason }}
          ACTION: ${{ steps.validate.outputs.action }}
        with:
          script: |
            const ok = process.env.STATUS === 'pass';
            const broke = process.env.STATUS !== 'pass' && !process.env.REASON;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: ok
                ? (process.env.ACTION && process.env.ACTION !== 'submit'
                    // Deliberately not "immediately": a push made with
                    // GITHUB_TOKEN does not trigger another workflow, so the
                    // index waits for its next scheduled run rather than
                    // rebuilding off this commit.
                    ? "Done — applied to the catalogue. The index rebuilds on a 15 minute schedule, so give it that long to appear."
                    : "Checks passed — a PR is open to add this to the index. Nothing more needed from you.")
                : broke
                  ? "Something went wrong on our side, not yours — the checks didn't finish. This is being looked at; you don't need to do anything."
                  : `Can't add this yet:\n\n> ${process.env.REASON}\n\nFix that and reopen this issue to re-run the checks.`
            });
            // A run that broke on our side is not the submitter's fault, so it
            // stays open rather than being closed under them.
            if (!ok && !broke) {
              await github.rest.issues.update({
                issue_number: context.issue.number,
                owner: context.repo.owner, repo: context.repo.repo, state: 'closed'
              });
            }
