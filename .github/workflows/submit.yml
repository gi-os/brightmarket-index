name: Validate submission

on:
  issues:
    types: [opened, reopened, labeled]

# An issue filed with two labels fires opened + labeled + labeled, and the test
# submission got three identical "checks passed" comments and opened the same PR
# three times over. One run per issue, latest wins.
concurrency:
  group: submission-${{ github.event.issue.number }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  validate:
    # Also ignores label events for anything other than 'submission', so adding
    # 'edit' or 'remove' alongside it isn't a second trigger.
    if: >-
      contains(github.event.issue.labels.*.name, 'submission') &&
      (github.event.action != 'labeled' || github.event.label.name == 'submission')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # pyaxmlparser reads the applicationId out of the binary manifest; the
      # string-pool guess it replaced picked an app's ancestor package.
      - run: pip install pyyaml pyaxmlparser

      - name: Validate
        id: validate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python3 scripts/validate_submission.py

      # An edit or a removal is the verified owner changing the text of a listing
      # that is already here -- ownership was proved by OAuth before the issue
      # was filed, and no new repo enters the catalogue. Holding those behind a
      # manual merge is friction with nothing on the other side of it: the first
      # thing that happened when this went live was someone editing their own
      # app and watching nothing change.
      #
      # A new listing still gets the human look, because that is a repo nobody
      # has looked at entering a list people install software from.
      - name: Apply an edit or removal directly
        if: steps.validate.outputs.status == 'pass' && steps.validate.outputs.action != 'submit'
        run: |
          git config user.name  "brightmarket-bot"
          git config user.email "bot@users.noreply.github.com"
          git add apps.yml
          if git diff --staged --quiet; then
            echo "nothing changed"
          else
            git commit -m "index: ${{ steps.validate.outputs.action }} ${{ steps.validate.outputs.name }} (closes #${{ github.event.issue.number }})"
            git push
          fi

      - name: Close the request
        if: steps.validate.outputs.status == 'pass' && steps.validate.outputs.action != 'submit'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.update({
              issue_number: context.issue.number,
              owner: context.repo.owner, repo: context.repo.repo, state: 'closed'
            });

      - name: Open PR
        if: steps.validate.outputs.status == 'pass' && steps.validate.outputs.action == 'submit'
        uses: peter-evans/create-pull-request@v6
        with:
          # One branch per app per action, so an edit and a removal for the same
          # app don't overwrite each other's branch.
          branch: ${{ steps.validate.outputs.action }}/${{ steps.validate.outputs.pkg }}
          title: "${{ steps.validate.outputs.action }}: ${{ steps.validate.outputs.name }}"
          body: |
            Closes #${{ github.event.issue.number }}

            Requested by the repo's owner, verified through GitHub OAuth before
            the issue was filed. For a new listing the automated checks also
            passed: public repo, published release, exactly one `.apk` asset,
            parseable tag, and an applicationId read out of the APK itself that
            isn't already indexed.
          commit-message: "index: ${{ steps.validate.outputs.action }} ${{ steps.validate.outputs.name }}"

      # always(): the first real submission passed its checks and then died on
      # the PR step, and because this had no condition it was skipped -- so the
      # person who submitted got no comment, no rejection, and no PR. Silence is
      # the one outcome a submission queue must never produce.
      - name: Comment the result
        if: always()
        uses: actions/github-script@v7
        env:
          STATUS: ${{ steps.validate.outputs.status }}
          REASON: ${{ steps.validate.outputs.reason }}
          ACTION: ${{ steps.validate.outputs.action }}
        with:
          script: |
            const ok = process.env.STATUS === 'pass';
            const broke = process.env.STATUS !== 'pass' && !process.env.REASON;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: ok
                ? (process.env.ACTION && process.env.ACTION !== 'submit'
                    // Deliberately not "immediately": a push made with
                    // GITHUB_TOKEN does not trigger another workflow, so the
                    // index waits for its next scheduled run rather than
                    // rebuilding off this commit.
                    ? "Done — applied to the catalogue. The index rebuilds on a 15 minute schedule, so give it that long to appear."
                    : "Checks passed — a PR is open to add this to the index. Nothing more needed from you.")
                : broke
                  ? "Something went wrong on our side, not yours — the checks didn't finish. This is being looked at; you don't need to do anything."
                  : `Can't add this yet:\n\n> ${process.env.REASON}\n\nFix that and reopen this issue to re-run the checks.`
            });
            // A run that broke on our side is not the submitter's fault, so it
            // stays open rather than being closed under them.
            if (!ok && !broke) {
              await github.rest.issues.update({
                issue_number: context.issue.number,
                owner: context.repo.owner, repo: context.repo.repo, state: 'closed'
              });
            }
