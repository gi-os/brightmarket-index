name: Validate submission

on:
  issues:
    types: [opened, reopened, labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  validate:
    if: contains(github.event.issue.labels.*.name, 'submission')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml

      - name: Validate
        id: validate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python3 scripts/validate_submission.py

      # Passing opens a PR rather than committing straight to main: a submission
      # is a stranger's repo entering the index, so it gets one human look.
      - name: Open PR
        if: steps.validate.outputs.status == 'pass'
        uses: peter-evans/create-pull-request@v6
        with:
          # One branch per app per action, so an edit and a removal for the same
          # app don't overwrite each other's branch.
          branch: ${{ steps.validate.outputs.action }}/${{ steps.validate.outputs.pkg }}
          title: "${{ steps.validate.outputs.action }}: ${{ steps.validate.outputs.name }}"
          body: |
            Closes #${{ github.event.issue.number }}

            Requested by the repo's owner, verified through GitHub OAuth before
            the issue was filed. For a new listing the automated checks also
            passed: public repo, published release, exactly one `.apk` asset,
            parseable tag, and an applicationId read out of the APK itself that
            isn't already indexed.
          commit-message: "index: ${{ steps.validate.outputs.action }} ${{ steps.validate.outputs.name }}"

      # always(): the first real submission passed its checks and then died on
      # the PR step, and because this had no condition it was skipped -- so the
      # person who submitted got no comment, no rejection, and no PR. Silence is
      # the one outcome a submission queue must never produce.
      - name: Comment the result
        if: always()
        uses: actions/github-script@v7
        env:
          STATUS: ${{ steps.validate.outputs.status }}
          REASON: ${{ steps.validate.outputs.reason }}
        with:
          script: |
            const ok = process.env.STATUS === 'pass';
            const broke = process.env.STATUS !== 'pass' && !process.env.REASON;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: ok
                ? "Checks passed — a PR is open to add this to the index. Nothing more needed from you."
                : broke
                  ? "Something went wrong on our side, not yours — the checks didn't finish. This is being looked at; you don't need to do anything."
                  : `Can't add this yet:\n\n> ${process.env.REASON}\n\nFix that and reopen this issue to re-run the checks.`
            });
            // A run that broke on our side is not the submitter's fault, so it
            // stays open rather than being closed under them.
            if (!ok && !broke) {
              await github.rest.issues.update({
                issue_number: context.issue.number,
                owner: context.repo.owner, repo: context.repo.repo, state: 'closed'
              });
            }
