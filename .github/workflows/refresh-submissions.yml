name: Refresh open submissions

# Rebuilds open submission branches on current main. Conflicts between two
# submissions are gone -- each app is its own file under apps/ -- but a branch
# can still be stale if the submitted repo has released since its checks ran.
# See scripts/refresh_submissions.py.
on:
  push:
    branches: [main]
    paths: ['apps/**']
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read
  issues: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml pyaxmlparser
      - name: Rebuild open submission branches on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/refresh_submissions.py
