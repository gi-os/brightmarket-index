name: Build index

on:
  schedule:
    # Every 15 minutes, offset off the quarter so it isn't competing with
    # everyone else's :00. Download counts come from GitHub and only refresh
    # when this runs, so an hourly build meant a number that could sit an hour
    # behind -- which reads as the count being broken rather than stale.
    - cron: '7,22,37,52 * * * *'
  push:
    branches: [main]
    paths: ['apps/**', 'scripts/build_index.py', 'icons/**']
  # Bright app repos POST here on release so the index updates in seconds
  # rather than waiting up to an hour.
  repository_dispatch:
    types: [app-released]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml pyaxmlparser

      - name: Build index
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/build_index.py

      # The index is served from the repo itself via GitHub Pages. Committing
      # only on change keeps the history readable instead of one commit an hour.
      - name: Commit if changed
        run: |
          git config user.name  "brightmarket-bot"
          git config user.email "bot@users.noreply.github.com"
          # apk/index.html is generated by the same script and was left out,
          # so the /apk short link stayed pinned to whatever version was
          # current the day it was first committed by hand.
          git add index-v1.json index-v1.json.gz apk/index.html
          if git diff --staged --quiet; then
            echo "index unchanged"
          else
            git commit -m "index: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
