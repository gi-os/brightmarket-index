name: Build index

on:
  schedule:
    # Hourly, off the hour, so it isn't competing with everyone else's :00 cron.
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths: ['apps.yml', 'scripts/build_index.py', 'icons/**']
  # Bright app repos POST here on release so the index updates in seconds
  # rather than waiting up to an hour.
  repository_dispatch:
    types: [app-released]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml

      - name: Build index
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/build_index.py

      # The index is served from the repo itself via GitHub Pages. Committing
      # only on change keeps the history readable instead of one commit an hour.
      - name: Commit if changed
        run: |
          git config user.name  "brightmarket-bot"
          git config user.email "bot@users.noreply.github.com"
          git add index-v1.json index-v1.json.gz
          if git diff --staged --quiet; then
            echo "index unchanged"
          else
            git commit -m "index: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
