name: Build index

on:
  schedule:
    # Every 15 minutes, offset off the quarter so it isn't competing with
    # everyone else's :00. Thirteen of the listed apps belong to other people and
    # have no way to announce a release, so this schedule is the only thing that
    # notices them -- and it now costs nothing in commits, because the result is
    # deployed rather than committed.
    - cron: '7,22,37,52 * * * *'
  push:
    branches: [main]
    # The pages themselves are here too. This workflow is what deploys the site,
    # so a filter that lists only the data meant an edit to submit.html or
    # browse.html sat on main until the next scheduled run happened to carry it
    # -- fifteen minutes of a fix looking like it had not worked.
    paths:
      - 'apps/**'
      - 'scripts/build_index.py'
      - 'icons/**'
      - 'assets/**'
      - '*.html'
  # Bright app repos POST here on release so the index updates in seconds
  # rather than waiting up to an hour.
  repository_dispatch:
    types: [app-released]
  workflow_dispatch:
    inputs:
      seed_index:
        description: >-
          Recovery only. Path to a recovered index-v1.json to take firstSeen and the signer
          pins from instead of the published one. Leave empty for every normal run.
        required: false
        default: ''
      allow_shrink:
        description: >-
          Publish even if the app count collapses. Only for a deliberate mass removal.
        required: false
        default: ''

# No contents:write any more -- this workflow no longer commits anything. It
# deploys the built site straight to Pages, which is what stopped the repo
# accruing ninety-six bot commits a day for download counters ticking over.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: build-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: pip install pyyaml pyaxmlparser

      - name: Build index
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Both empty on every trigger except a hand-run recovery; see the inputs above.
          SEED_INDEX: ${{ inputs.seed_index }}
          ALLOW_SHRINK: ${{ inputs.allow_shrink }}
        run: python3 scripts/build_index.py

      # Everything the site serves, generated files included. Built fresh here
      # rather than committed, which also removes a whole class of bug:
      # apk/index.html once spent a week serving a stale version because it was
      # generated by this script and never staged by the step that committed.
      - name: Upload the site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: .

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
