name: Build index

on:
  schedule:
    # Every 15 minutes, offset off the quarter so it isn't competing with
    # everyone else's :00. Thirteen of the listed apps belong to other people and
    # have no way to announce a release, so this schedule is the only thing that
    # notices them -- and it now costs nothing in commits, because the result is
    # deployed rather than committed.
    - cron: '7,22,37,52 * * * *'
  push:
    branches: [main]
    paths: ['apps/**', 'scripts/build_index.py', 'icons/**']
  # Bright app repos POST here on release so the index updates in seconds
  # rather than waiting up to an hour.
  repository_dispatch:
    types: [app-released]
  workflow_dispatch:

# No contents:write any more -- this workflow no longer commits anything. It
# deploys the built site straight to Pages, which is what stopped the repo
# accruing ninety-six bot commits a day for download counters ticking over.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: build-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml pyaxmlparser

      - name: Build index
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/build_index.py

      # Everything the site serves, generated files included. Built fresh here
      # rather than committed, which also removes a whole class of bug:
      # apk/index.html once spent a week serving a stale version because it was
      # generated by this script and never staged by the step that committed.
      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
