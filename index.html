<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- The root used to serve the repo's README, rendered by Jekyll: whoever
     typed the bare domain landed on documentation about the catalogue instead
     of the catalogue. The store stays at /browse.html rather than moving here,
     because that path is printed in twenty app READMEs, in the app itself and
     in every QR already generated. -->
<meta http-equiv="refresh" content="0; url=./browse.html" />
<link rel="canonical" href="https://brightmarket.gzl.dev/browse.html" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="alternate icon" href="/favicon.ico" />
<meta name="theme-color" content="#000000" />
<title>BrightMarket</title>
<style>
  html,body{height:100%}
  body{margin:0;background:#000;color:#fff;display:flex;align-items:center;
       justify-content:center;font-family:ui-sans-serif,system-ui,sans-serif}
  a{color:#fff}
</style>
<script>location.replace("./browse.html");</script>
</head>
<body>
  <!-- Meta refresh, then a script, then a link: the first two cover every
       normal browser, and the link means a client that honours neither still
       has a way forward instead of a black page. -->
  <p>Opening the catalogue… <a href="./browse.html">continue</a></p>
</body>
</html>
