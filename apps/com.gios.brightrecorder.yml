pkg: com.gios.brightrecorder
name: BrightRecorder
repo: gi-os/BrightRecorder
category: media
summary: A tape recorder for moments. Recordings are filed by where you were and when,
  and the brightness wheel winds through all of them as one continuous tape — forwards
  or backwards, at any speed, audible as it goes. Keep several tapes at once, each with
  its own name and pattern.
