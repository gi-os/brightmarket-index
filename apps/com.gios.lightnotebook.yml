pkg: com.gios.lightnotebook
name: BrightNotebook
repo: gi-os/BrightNotebook
category: productivity
summary: >-
  Notes and a calendar with your day gathered on one page: entries, reminders, your work
  calendar, the photos you took, the calls you had and the holidays in between. Photograph a
  page and Claude reads it into a note.
adb:
  - adb shell appops set com.gios.lightnotebook SYSTEM_ALERT_WINDOW allow
