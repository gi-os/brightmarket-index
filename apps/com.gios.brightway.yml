pkg: com.gios.brightway
name: BrightWay
repo: gi-os/BrightWay
category: travel
summary: >-
  Walking and subway directions, text-first: one big instruction, the wheel scrolls the trip.
  Search opens on a map you can zoom with the wheel, and the compass keeps working with no key
  and no signal.
adb:
  - adb shell pm grant com.gios.brightway android.permission.WRITE_SECURE_SETTINGS
