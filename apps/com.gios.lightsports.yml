pkg: com.gios.lightsports
name: BrightSports
repo: gi-os/BrightSports
category: utilities
summary: >-
  Live scores, standings and notifications across twenty-two leagues, from the four majors to
  Formula 1, on public feeds that need no key. Follow teams and get one column of scores.
adb:
  - adb shell appops set com.gios.lightsports SYSTEM_ALERT_WINDOW allow
