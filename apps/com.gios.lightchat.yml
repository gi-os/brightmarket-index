pkg: com.gios.lightchat
name: BrightChat
repo: gi-os/BrightChat
upstream: craigeley/chat
category: utilities
summary: >-
  iMessage through a self-hosted BlueBubbles server over Tailscale. Favorites, known and
  unknown threads, photos and video in full color, and a heads-up box when a text arrives.
adb:
  - adb shell appops set com.gios.lightchat SYSTEM_ALERT_WINDOW allow
  - adb shell pm grant com.gios.lightchat android.permission.WRITE_SECURE_SETTINGS
