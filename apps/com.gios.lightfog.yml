pkg: com.gios.lightfog
name: FogLight
repo: gi-os/FogLight
category: utilities
summary: >-
  A Fog of World companion: records where you go, clears the fog over an OpenStreetMap base
  map, and imports your real history out of the app's own sync files.
adb:
  - adb shell pm grant com.gios.lightfog android.permission.ACCESS_BACKGROUND_LOCATION
