pkg: com.gios.brighthotspot
name: BrightHotspot
repo: gi-os/BrightHotspot
category: utilities
summary: >-
  Instant Hotspot for the device Apple left out. Open your iPad and the phone, still in your
  pocket, raises its hotspot; the iPad joins a network it already knows. Shizuku makes the
  call.
adb:
  # Not a grant on this app -- the one thing it needs a shell for is somebody else's service.
  # Raising the hotspot is signature|privileged since Android 11, so it goes through Shizuku, and
  # Shizuku's own way in is the wireless-debugging pairing flow that Android tears down on every
  # reboot. BrightControl already holds an adb shell; this asks it to run the one line.
  - start shizuku
