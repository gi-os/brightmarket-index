pkg: com.gios.brightcollect
name: Collect
repo: gi-os/BrightCollect
category: media
summary: >-
  Photograph a thing and keep the thing, not the photograph: the object is cut out on the
  phone and kept as a sticker on a flat-lay shelf. A wand and a brush fix the edges the model
  got wrong, and a second model names it for you.
adb:
  - adb shell pm grant com.gios.brightcollect android.permission.WRITE_SECURE_SETTINGS
