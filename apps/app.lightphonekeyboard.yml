# The original Light Phone keyboard clone that BrightKeyboard forks. BrightKeyboard used this
# applicationId up to v3.11, then moved to com.gios.brightkeyboard on 2026-09-19 and gave the id
# back. The frozen "BrightKeyboard 3.x" bridge listing (gi-os/BrightKeyboard-3x) lived here until
# 2026-10-07; this entry now points at the author's own repo.
pkg: app.lightphonekeyboard
name: Light Keyboard
repo: adam-weber/light-keyboard
category: hardware
summary: >-
  A clone of the Light Phone 3's built-in keyboard, packaged as a system keyboard so every app
  shares the same look. Optional autocorrect and voice dictation, both fully on-device.
